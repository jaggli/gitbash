name: CI

on:
  pull_request:
  # Pushes to main run CI through release.yml, which only releases when it passes
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x install.sh bin/gitbash commands/*.sh scripts/*.sh test/helpers/bin/* test/helpers/update-bin/* test/helpers/install-bin/*

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu, bash 5
            os: ubuntu-latest
            bash: /bin/bash
          # The oldest fzf gitbash supports (GB_FZF_MIN_VERSION), for fzf_real.bats
          - name: ubuntu, fzf 0.36 (minimum)
            os: ubuntu-latest
            bash: /bin/bash
            fzf: 0.36.0
            fzf_sha256: 7e6271c7935ba0e92fc04eca346a2b2320561ca862b6bc76301376b70b3558b3
          - name: macos, bash 3.2
            os: macos-latest
            bash: /bin/bash
          - name: macos, bash 5
            os: macos-latest
            bash: brew
          # Starting processes is slow in Git Bash: split its tests into shards
          - name: windows, git bash, 1/4
            os: windows-latest
            bash: ""
            shard: 1
            shards: 4
          - name: windows, git bash, 2/4
            os: windows-latest
            bash: ""
            shard: 2
            shards: 4
          - name: windows, git bash, 3/4
            os: windows-latest
            bash: ""
            shard: 3
            shards: 4
          - name: windows, git bash, 4/4
            os: windows-latest
            bash: ""
            shard: 4
            shards: 4
    env:
      # Real symlinks in Git Bash (tests link directories like pnpm does)
      MSYS: winsymlinks:nativestrict
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install fzf (Linux)
        if: runner.os == 'Linux'
        env:
          FZF_VERSION: ${{ matrix.fzf }}
          FZF_SHA256: ${{ matrix.fzf_sha256 }}
        run: |
          if [ -z "$FZF_VERSION" ]; then
            sudo apt-get install -y fzf
            exit 0
          fi
          # A specific release, checked against its pinned checksum
          file="fzf-$FZF_VERSION-linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/junegunn/fzf/releases/download/$FZF_VERSION/$file"
          echo "$FZF_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/$file" -C /usr/local/bin fzf
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install fzf bash
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        # choco exits 0 when its feed times out, so check for fzf and retry
        run: |
          for i in 1 2 3; do
            choco install fzf -y --no-progress && command -v fzf && break
            sleep 15
          done
          command -v fzf
      - name: Select bash
        run: |
          if [ "${{ matrix.bash }}" = "brew" ]; then
            echo "GB_BASH=$(brew --prefix)/bin/bash" >> "$GITHUB_ENV"
          else
            echo "GB_BASH=${{ matrix.bash }}" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - name: Versions
        run: |
          "${GB_BASH:-bash}" --version | head -1
          git --version
          fzf --version
      # bats directly: on Windows npm would run it through cmd.exe, which may not find Git's bash
      - name: Run tests
        env:
          SHARD: ${{ matrix.shard || 1 }}
          SHARDS: ${{ matrix.shards || 1 }}
        run: |
          # Test files go to the shard with the fewest tests so far (largest files first)
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(
            for f in test/*.bats; do echo "$(grep -c '^@test' "$f") $f"; done | sort -k1,1rn -k2 |
              awk -v n="$SHARDS" -v me="$SHARD" '{
                best = 1
                for (i = 2; i <= n; i++) if (load[i] < load[best]) best = i
                load[best] += $1
                if (best == me) print $2
              }')
          echo "Shard $SHARD/$SHARDS: ${files[*]}"
          ./node_modules/.bin/bats "${files[@]}"

  # The one check the main branch ruleset requires: independent of the jobs above
  passed:
    name: CI passed
    if: ${{ always() }}
    needs: [shellcheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
