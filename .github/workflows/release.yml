# Releases run only here, never from a laptop.
#
# On every push to main, after CI passes:
# - Pending changesets: open or update the "chore: release vX.Y.Z" pull request
#   (changeset version: package.json, CHANGELOG.md).
# - No pending changesets and package.json's version is not on npm yet (the
#   release pull request was merged): publish to npm with trusted publishing
#   (OIDC, no npm token, provenance), then tag and create the GitHub release.
#
# npm is published before the GitHub release, which is what 'gitbash --update'
# and install.sh look for. Every step checks what is done already, so a failed
# run can simply be re-run.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  plan:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      version: ${{ steps.plan.outputs.version }}
      on_npm: ${{ steps.plan.outputs.on_npm }}
      released: ${{ steps.plan.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=false
          for file in .changeset/*.md; do
            [ -e "$file" ] && [ "$(basename "$file")" != "README.md" ] && pending=true
          done
          version="$(node -p "require('./package.json').version")"

          # Only a 404 means "not published"; any other error stops the release
          on_npm=true
          if ! out="$(npm view "gitbash@$version" version 2>&1)"; then
            case "$out" in
              *E404*) on_npm=false ;;
              *) echo "$out" >&2; exit 1 ;;
            esac
          fi
          released=true
          gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || released=false

          echo "pending=$pending version=$version on_npm=$on_npm released=$released"
          {
            echo "pending=$pending"
            echo "version=$version"
            echo "on_npm=$on_npm"
            echo "released=$released"
          } >> "$GITHUB_OUTPUT"

  release-pr:
    needs: plan
    if: needs.plan.outputs.pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the release branch
      pull-requests: write  # open or update the release pull request
      actions: write        # start CI for it
    steps:
      # No credentials in .git/config: npm packages below run without the token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Apply changesets
        run: npx --no-install changeset version
      - name: Push the release branch and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: changeset-release/main
        run: |
          version="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit --quiet -m "chore: release v$version"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin "$BRANCH"

          {
            echo "Merging this publishes **gitbash v$version** to npm from GitHub Actions and creates the GitHub release."
            echo
            echo "## Changes"
            echo
            scripts/release-notes.sh "$version"
          } > "$RUNNER_TEMP/body.md"
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$BRANCH" --title "chore: release v$version" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "chore: release v$version" --body-file "$RUNNER_TEMP/body.md"
          fi
          # Pull requests opened with the workflow token don't start pull_request runs
          gh workflow run ci.yml --ref "$BRANCH"

  publish:
    needs: plan
    if: needs.plan.outputs.pending == 'false' && (needs.plan.outputs.on_npm == 'false' || needs.plan.outputs.released == 'false')
    runs-on: ubuntu-latest
    # Protect it in Settings → Environments (only main, optionally a required reviewer)
    environment: npm
    permissions:
      contents: write  # tag and GitHub release
      id-token: write  # npm trusted publishing
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "npm $npm_version is too old for trusted publishing (needs 11.5.1)" >&2
            exit 1
          fi
      - name: Check the version matches this commit
        run: test "$(node -p "require('./package.json').version")" = "$VERSION"
      # Nothing is installed or built: the package is published as checked out
      - name: Publish to npm
        if: needs.plan.outputs.on_npm == 'false'
        run: npm publish --ignore-scripts
      - name: Create the tag and GitHub release
        if: needs.plan.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
